checkpoint:
  enable_save: False
  save_path: "_checkpoints/dsv4h_fused_pp4_recomp"
  save_max: 1
  no_save_optim: False
  async_save: False
  prefix: "custom"
  remove_redundancy: False
  load_path: ""
  load_balanced: False
  no_load_optim: True
  load_worker_number: 1

context:
  device_target: Ascend
  max_device_memory: "58GB"
  mode: 1

training:
  steps: 3
  local_batch_size: 1
  global_batch_size: 8
  max_norm: 1.0
  seed: 42
  deterministic: False

optimizer:
  type: Muon
  weight_decay: 0.1
  momentum: 0.95
  adamw_betas:
    - 0.9
    - 0.95
  adamw_eps: 1.0e-8

lr_scheduler:
  type: ConstantWarmUpLR
  learning_rate: 1.0e-5
  warmup_ratio: 0

parallelism:
  pipeline_parallel: 4
  data_parallel_shard: 2
  expert_parallel: 2
  tensor_parallel: 1
  context_parallel: 1
  sequence_parallel: False
  disable_gradient_division: True
  data_parallel_shard_strategy: optim_grads_params
  reshard_after_forward_policy: default
  cpu_offload: False
  pipeline_parallel_layers_per_stage: "auto"
  pipeline_parallel_schedule: "1f1b"

recompute:
  mode: full
  full_recompute_layer: ["0-7"]

train_dataset:
  dataloader:
    type: MindDataset
    dataset_files:
      - "/home/suhaibo/workspace/dsv4h_data_4096/dataset.mindrecord"
    column_names: ["input_ids", "labels", "loss_mask", "position_ids"]
    shuffle: false
  drop_remainder: True
  num_parallel_workers: 8
  prefetch_size: 1
  numa_enable: False

model:
  model_type: deepseek_v4
  architectures: DeepseekV4ForCausalLM
  vocab_size: 129280
  seq_length: 4096
  hidden_size: 4096
  num_hidden_layers: 8
  num_attention_heads: 64
  multi_latent_attention: true
  experimental_attention_variant: dsv4_hybrid
  q_lora_rank: 1024
  kv_lora_rank: 512
  head_dim: 512
  qk_rope_head_dim: 64
  v_head_dim: 512
  o_groups: 8
  o_lora_rank: 1024
  qk_layernorm: true
  params_dtype: bfloat16
  compute_dtype: bfloat16
  layernorm_compute_dtype: float32
  num_nextn_predict_layers: 0
  moe_intermediate_size: 2048
  n_routed_experts: 8
  num_experts_per_tok: 2
  n_shared_experts: 1
  moe_shared_expert_intermediate_size: 2048
  first_k_dense_replace: 1
  gated_linear_unit: true
  moe_grouped_gemm: true
  router_dense_type: float32
  norm_topk_prob: true
  n_group: 0
  moe_router_load_balancing_type: seq_aux_loss
  moe_aux_loss_coeff: 0.001
  # mHC -- FUSED
  enable_hyper_connections: true
  hc_mult: 4
  use_fused_mhc: true
  hc_sinkhorn_iters: 20
  hc_eps: 1.0e-06
  mhc_init_gating_factor: 0.01
  # DSA -- FUSED
  index_n_heads: 64
  index_head_dim: 128
  index_topk: 512
  apply_dsa_kernel_fusion: true
  dsa_indexer_loss_coeff: 0.001
  dsa_indexer_use_sparse_loss: true
  # CSA (length must equal num_hidden_layers = 8)
  compress_ratios: [0, 4, 128, 4, 128, 4, 128, 4]
  sliding_window: 128
  compress_rope_theta: 40000
  rope_theta: 10000
  use_flash_attention: true
