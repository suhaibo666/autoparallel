<text class="dg-note t-note" x="60" y="28" text-anchor="start" font-size="14">两次追问定类：① 机制在建模范围内吗 —— 不在则不是 derived；② 机制是确定性的、还是取决于运行期数据 —— 确定性的可以建成公式，取决于数据的只能声明假设。</text>
