<svg class="dg" viewBox="0 0 1180 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="总体分层与数据流">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker>
</defs>
<rect class="dg-frame" x="70" y="40" width="1040" height="92" rx="10"/>
<text class="dg-ftitle t-sem" x="82" y="32">S1 语义层</text>
<rect class="dg-box b-sem" x="430" y="58" width="320" height="56" rx="8"/>
<text class="dg-blabel dg-mono t-sem" x="590.0" y="83.5" font-size="15">TypedRegistrySnapshot</text>
<text class="dg-bsub dg-mono t-sem" x="590.0" y="98.5" font-size="12">Op 语义词典（冻结、带 digest）</text>
<rect class="dg-frame" x="70" y="170" width="1040" height="92" rx="10"/>
<text class="dg-ftitle t-ir" x="82" y="162">S2 结构层</text>
<rect class="dg-box b-ir" x="430" y="188" width="320" height="56" rx="8"/>
<text class="dg-blabel dg-mono t-ir" x="590.0" y="213.5" font-size="15">CoreIR</text>
<text class="dg-bsub dg-mono t-ir" x="590.0" y="228.5" font-size="12">逻辑事实：Op / 值 / 存储关系</text>
<rect class="dg-frame" x="70" y="300" width="1040" height="92" rx="10"/>
<text class="dg-ftitle t-derived" x="82" y="292">S3 反向层</text>
<rect class="dg-box b-derived" x="430" y="318" width="320" height="56" rx="8"/>
<text class="dg-blabel dg-mono t-derived" x="590.0" y="343.5" font-size="15">BackwardIR</text>
<text class="dg-bsub dg-mono t-derived" x="590.0" y="358.5" font-size="12">前向+反向+重算，同一节点类型</text>
<rect class="dg-frame" x="70" y="430" width="1040" height="92" rx="10"/>
<text class="dg-ftitle t-plan" x="82" y="422">S4 布局层</text>
<rect class="dg-box b-plan" x="430" y="448" width="320" height="56" rx="8"/>
<text class="dg-blabel dg-mono t-plan" x="590.0" y="473.5" font-size="15">PlacementPlan</text>
<text class="dg-bsub dg-mono t-plan" x="590.0" y="488.5" font-size="12">位置：mesh / shard / local shape</text>
<rect class="dg-frame" x="70" y="560" width="1040" height="92" rx="10"/>
<text class="dg-ftitle t-plan" x="82" y="552">S5 执行层</text>
<rect class="dg-box b-plan" x="430" y="578" width="320" height="56" rx="8"/>
<text class="dg-blabel dg-mono t-plan" x="590.0" y="603.5" font-size="15">ExecutionPlan</text>
<text class="dg-bsub dg-mono t-plan" x="590.0" y="618.5" font-size="12">时序：event / lifetime / alloc-free</text>
<rect class="dg-box b-input" x="90" y="58" width="250" height="40" rx="8"/>
<text class="dg-blabel t-input" x="215.0" y="75.5" font-size="15">Native / User / Patch</text>
<text class="dg-bsub dg-mono t-input" x="215.0" y="90.5" font-size="12">三个物理隔离注册域</text>
<rect class="dg-box b-input" x="820" y="58" width="250" height="40" rx="8"/>
<text class="dg-blabel t-input" x="945.0" y="75.5" font-size="15">FrameworkRuntimeSnapshot</text>
<text class="dg-bsub dg-mono t-input" x="945.0" y="90.5" font-size="12">版本参与 digest</text>
<rect class="dg-box b-input" x="90" y="188" width="250" height="40" rx="8"/>
<text class="dg-blabel t-input" x="215.0" y="205.5" font-size="15">源码 → DraftGraph</text>
<text class="dg-bsub dg-mono t-input" x="215.0" y="220.5" font-size="12">符号 / 数据流 / attrs 字面值</text>
<rect class="dg-box b-input" x="820" y="318" width="250" height="40" rx="8"/>
<text class="dg-blabel t-input" x="945.0" y="335.5" font-size="15">RecomputeSpec</text>
<text class="dg-bsub dg-mono t-input" x="945.0" y="350.5" font-size="12">重算策略（派生输入）</text>
<rect class="dg-box b-input" x="820" y="448" width="250" height="40" rx="8"/>
<text class="dg-blabel t-input" x="945.0" y="465.5" font-size="15">ParallelConfig</text>
<text class="dg-bsub dg-mono t-input" x="945.0" y="480.5" font-size="12">tp / pp / ep / cp / dp</text>
<rect class="dg-box b-input" x="820" y="578" width="250" height="40" rx="8"/>
<text class="dg-blabel t-input" x="945.0" y="595.5" font-size="15">BufferCalibration</text>
<text class="dg-bsub dg-mono t-input" x="945.0" y="610.5" font-size="12">measured 量载体</text>
<polyline class="dg-arrow a-note" points="590.0,114 590.0,158" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-note" points="590.0,244 590.0,288" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-note" points="590.0,374 590.0,418" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-note" points="590.0,504 590.0,548" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-note" points="590.0,634 590.0,690" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-input" points="340,78 430,78" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-input" points="820,78 750,78" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-input" points="340,208 430,208" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-input" points="820,338 750,338" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-input" points="820,468 750,468" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-input" points="820,598 750,598" marker-end="url(#ah)"/>
<rect class="dg-frame" x="70" y="690" width="1040" height="120" rx="10"/>
<text class="dg-ftitle t-backend" x="82" y="682">S6 只读后端</text>
<rect class="dg-box b-backend" x="150" y="716" width="330" height="72" rx="8"/>
<text class="dg-blabel t-backend" x="315.0" y="749.5" font-size="15">MemorySimulator</text>
<text class="dg-bsub dg-mono t-backend" x="315.0" y="764.5" font-size="12">allocator / liveness / OOM</text>
<rect class="dg-box b-backend" x="700" y="716" width="330" height="72" rx="8"/>
<text class="dg-blabel t-backend" x="865.0" y="749.5" font-size="15">TimeSimulator</text>
<text class="dg-bsub dg-mono t-backend" x="865.0" y="764.5" font-size="12">cost / contention / pipeline DES</text>
<polyline class="dg-arrow a-note" points="470,634 315,700 315,712" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-note" points="710,634 865,700 865,712" marker-end="url(#ah)"/>
<text class="dg-note t-block" x="590" y="754" text-anchor="middle" font-size="13">互不依赖</text>
<text class="dg-note t-block" x="590" y="771" text-anchor="middle" font-size="13">不回写上游</text>
<rect class="dg-frame" x="70" y="838" width="1040" height="96" rx="10"/>
<text class="dg-ftitle t-note" x="82" y="830">S7 报告</text>
<rect class="dg-box b-note" x="430" y="862" width="320" height="52" rx="8"/>
<text class="dg-blabel dg-mono t-note" x="590.0" y="885.5" font-size="15">UnifiedReport</text>
<text class="dg-bsub dg-mono t-note" x="590.0" y="900.5" font-size="12">结果 + provenance + confidence</text>
<polyline class="dg-arrow a-note" points="315,788 430,880" marker-end="url(#ah)"/>
<polyline class="dg-arrow a-note" points="865,788 750,880" marker-end="url(#ah)"/>
<text class="dg-note t-note" x="90" y="966" text-anchor="start" font-size="14">不变量：每层只增加一类信息；下游只读上游，从不回写。修改并行配置只使 S4/S5 失效，CoreIR 保持不变（由此支持交互式 what-if）。</text>
</svg>